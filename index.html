<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barbería Premium</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <h1>Barbería Premium</h1>
</header>

<section class="seccion">
  <h2>Servicios</h2>

  <div class="contenedor">

    <div class="card" onclick="abrirModal('Corte Clásico','Incluye corte completo','S/ 45 - S/ 70','img/corte-clasico.jpg')">Corte Clásico</div>

    <div class="card" onclick="abrirModal('Fade','Degradado profesional','S/ 50 - S/ 85','img/fade.jpg')">Fade</div>

    <div class="card" onclick="abrirModal('Corte Niño','Servicio rápido','S/ 35 - S/ 50','img/corte-nino.jpg')">Corte Niño</div>

    <div class="card" onclick="abrirModal('Buzz Cut','Corte uniforme','S/ 30 - S/ 45','img/buzz-cut.jpg')">Buzz Cut</div>

    <div class="card" onclick="abrirModal('Perfilado Barba','Perfilado profesional','S/ 30 - S/ 45','img/perfilado-barba.jpg')">Perfilado Barba</div>

    <div class="card" onclick="abrirModal('Ritual Barba','Afeitado completo','S/ 50 - S/ 80','img/ritual-barba.jpg')">Ritual Barba</div>

    <div class="card" onclick="abrirModal('Tinturación Barba','Coloración','S/ 40 - S/ 60','img/tinturacion-barba.jpg')">Tinturación</div>

    <div class="card" onclick="abrirModal('Limpieza Facial','Tratamiento facial','S/ 60 - S/ 130','img/limpieza-facial.jpg')">Limpieza Facial</div>

    <div class="card" onclick="abrirModal('Camuflaje Canas','Color natural','S/ 80 - S/ 150','img/camuflaje-canas.jpg')">Camuflaje</div>

    <div class="card" onclick="abrirModal('Cejas','Perfilado','S/ 15 - S/ 25','img/cejas.jpg')">Cejas</div>

  </div>
</section>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-contenido">
    <span class="cerrar" onclick="cerrarModal()">&times;</span>
    <h2 id="titulo"></h2>
    <img id="imagen">
    <p id="descripcion"></p>
    <p id="precio"></p>
    <button onclick="irWhatsApp()">Reservar</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
